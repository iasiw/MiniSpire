<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择卡牌 - MiniSpire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 50px;
            width: 80%;
            max-width: 1000px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .card {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card_selected {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card.selected {
            border: 2px solid #4CAF50;
            background-color: #e8f5e8;
        }
        .card-name {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card-cost {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .card-desc {
            font-size: 12px;
            color: #333;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #f44336;
        }
        .btn-secondary:hover {
            background-color: #da190b;
        }
        .selected-count {
            margin: 20px 0;
            font-size: 18px;
            color: #333;
        }
        .selected-cards-container {
            margin-top: 40px;
        }
        .selected-cards-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .selected-cards-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 80%;
        }
        .modal h3 {
            margin-top: 0;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .quantity-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
        }
        .quantity-input {
            width: 60px;
            height: 40px;
            text-align: center;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 0 10px;
        }
        .hidden {
            display: none;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>选择初始卡牌</h1>
        <p>请选择10张卡牌作为你的初始卡组</p>
        <div class="selected-count">已选择: <span id="count_ku">0</span>/10</div>
        <div class="card-grid" id="card-grid">
            <!--牌库-->
        </div>
         <div class="selected-cards-container">
            <h3 class="selected-cards-title">已选择的卡牌</h3>
            <div id="selected-cards-list" class="selected-cards-list">
                <!--对象牌库-->
                <div class="selected-card-item" style="display: none;">
                    <div class="selected-card-info">
                        <div class="selected-card-name">卡牌名称</div>
                        <div class="selected-card-count">数量: 1</div>
                    </div>
                </div>
            </div>
        </div>
        <button class="btn" id="start-game-btn" >开始游戏</button>
        <button class="btn" id="save-btn" >保存卡组</button>
        <button class="btn" id="load-btn" >加载卡组</button>
        <button class="btn" id="reset-game-btn" >重置游戏</button>
        <button class="btn btn-secondary" onclick="window.location.href='/'">返回主页</button>
    </div>
</body>
<script src="/static/get_card.js"></script>
</html>
